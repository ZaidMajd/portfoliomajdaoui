  <g stroke="#7dd7cb" stroke-width="3" fill="none" opacity="0.75">
    <path d="M250 196h84"/>
    <path d="M626 196h84"/>
    <path d="M250 524h84"/>
    <path d="M626 524h84"/>
    <path d="M480 560v34"/>

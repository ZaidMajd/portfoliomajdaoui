    <circle cx="480" cy="360" r="112" fill="url(#core)"/>
    <path d="M480 284c-34 20-69 28-104 31 0 79 25 136 104 177 79-41 104-98 104-177-35-3-70-11-104-31z" fill="#fff" opacity="0.88"/>
    <path d="M480 320l17 34 38 6-27 27 6 38-34-18-34 18 6-38-27-27 38-6z" fill="#173f45"/>
    <text x="480" y="192" text-anchor="middle" fill="#f4f6ef" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">CYBER WATCH</text>
    <text x="480" y="224" text-anchor="middle" fill="#b7c7c4" font-family="Segoe UI, Arial, sans-serif" font-size="20">Attaques informatiques a surveiller</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <g>
      <rect x="70" y="150" width="180" height="92" rx="18" fill="#f4f6ef"/>
      <text x="100" y="188" fill="#9d4b32" font-size="14" font-weight="700">MENACE 01</text>
      <text x="100" y="217" fill="#102627" font-size="28" font-weight="700">PHISHING</text>
      <text x="100" y="236" fill="#4f6360" font-size="14">Usurpation et vol</text>
    </g>
    <g>
      <rect x="710" y="150" width="180" height="92" rx="18" fill="#f4f6ef"/>
      <text x="740" y="188" fill="#9d4b32" font-size="14" font-weight="700">MENACE 02</text>
      <text x="740" y="217" fill="#102627" font-size="24" font-weight="700">RANSOMWARE</text>
      <text x="740" y="236" fill="#4f6360" font-size="14">Chiffrement et extorsion</text>
    </g>
    <g>
      <rect x="70" y="478" width="180" height="92" rx="18" fill="#f4f6ef"/>
      <text x="100" y="516" fill="#9d4b32" font-size="14" font-weight="700">MENACE 03</text>
      <text x="100" y="545" fill="#102627" font-size="28" font-weight="700">DDoS</text>
      <text x="100" y="564" fill="#4f6360" font-size="14">Saturation de services</text>
    </g>
    <g>
      <rect x="710" y="478" width="180" height="92" rx="18" fill="#f4f6ef"/>
      <text x="740" y="516" fill="#9d4b32" font-size="14" font-weight="700">MENACE 04</text>
      <text x="740" y="545" fill="#102627" font-size="24" font-weight="700">SUPPLY CHAIN</text>
      <text x="740" y="564" fill="#4f6360" font-size="14">Compromission d'un tiers</text>
    </g>
    <g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">Veille techno cybersécurité</title>
  <desc id="desc">Infographie présentant phishing, ransomware, DDoS, supply chain et zero-day autour d'un noyau cybersécurité.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2c2d"/>
      <stop offset="100%" stop-color="#173f45"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1fb6a6"/>
      <stop offset="100%" stop-color="#e6a65d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#061314" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="960" height="720" rx="36" fill="url(#bg)"/>
  <g opacity="0.18">
    <circle cx="160" cy="110" r="72" fill="#7dd7cb"/>
    <circle cx="820" cy="100" r="94" fill="#e6a65d"/>
    <circle cx="890" cy="630" r="118" fill="#7dd7cb"/>
    <circle cx="120" cy="620" r="104" fill="#e6a65d"/>
  </g>

  <g filter="url(#shadow)">
